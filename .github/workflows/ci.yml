# Verifies every change: code quality and tests, the structural evaluation, the SPFx package build
# and the Terraform configuration. No cloud credentials; safe for pull requests from forks.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/spfx-assistant/package-lock.json
      - name: Install
        run: |
          npm ci
          npm --prefix apps/spfx-assistant ci
      - name: Format, lint, typecheck and tests
        run: npm run check
      - name: Structural evaluation (mock, hard gates)
        run: npm run eval:mock
      - name: SPFx package build (example configuration, not published)
        working-directory: apps/spfx-assistant
        run: |
          cp config/api.example.json config/api.json
          npm run elements
          npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate
        run: |
          for root in bootstrap envs/dev envs/dev-identity; do
            terraform -chdir=infra/terraform/$root init -backend=false -input=false
            terraform -chdir=infra/terraform/$root validate
          done
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --chdir infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: checkov
        # Pinned through pip so CI and local runs use the same version and rules.
        run: |
          pipx install checkov==3.3.19
          checkov --directory infra/terraform --config-file .checkov.yaml
