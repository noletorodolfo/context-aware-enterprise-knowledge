# Deploys the Knowledge API (Azure Functions, Flex Consumption) after the owner approves the "dev"
# environment. The SharePoint package is not deployed from CI: it embeds partner values (Phase 4 D4).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - apps/knowledge-api/**
      - packages/**
      - prompts/**
      - package-lock.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build the deployment package
        run: |
          npm ci
          npm run package -w @kb/knowledge-api
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish to the Function App
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ secrets.FUNCTION_APP_NAME }}
          package: apps/knowledge-api/deploy
          sku: flexconsumption
          remote-build: false
      - name: Smoke test (no token must be rejected with 401)
        env:
          FUNCTION_APP_NAME: ${{ secrets.FUNCTION_APP_NAME }}
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -d '{}' \
              "https://${FUNCTION_APP_NAME}.azurewebsites.net/api/ask" || true)
            echo "attempt ${attempt}: HTTP ${status}"
            [ "$status" = "401" ] && exit 0
            sleep 20
          done
          echo "::error::expected HTTP 401 without a token"
          exit 1
